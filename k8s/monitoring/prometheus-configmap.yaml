apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: trabalho-microsservico
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: api-gateway
        metrics_path: /metrics
        static_configs:
          - targets:
              - api-gateway:3000

      - job_name: bookings-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - bookings-service:3001
