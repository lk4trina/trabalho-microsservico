global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway-homol'
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway-homol.onrender.com']

  - job_name: 'bookings-service-homol'
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['bookings-service-homol-klof.onrender.com']
