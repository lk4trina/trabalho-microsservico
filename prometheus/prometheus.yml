global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    scrape_interval: 5s
    static_configs:
      - targets: ['api-gateway:3000'] # O nome do serviço no compose é api-gateway

  - job_name: 'bookings-service'
    scrape_interval: 5s
    static_configs:
      - targets: ['bookings-service:3001']      