name: CI - API Gateway

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'backend/api-gateway/**'
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - 'backend/api-gateway/**'

jobs:
  build-and-test:
    name: Build, Test and SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/api-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests and generate coverage
        run: npm test -- --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend/api-gateway
          args: >
            -Dsonar.projectKey=lk4trina_trabalho-microsservico
            -Dsonar.organization=Katrina
            -Dsonar.sources=src
            -Dsonar.tests=testes
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test # Garante que o Docker só roda se o passo anterior (testes) passar!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api-gateway
          file: ./backend/api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest