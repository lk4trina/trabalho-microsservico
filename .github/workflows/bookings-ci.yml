name: CI - Bookings Service

on:
  push:
    branches: [ "main", "develop", 'feature/**' ]
    paths:
      - 'backend/bookings-service/**' 
      - '.github/workflows/bookings-ci.yml'
  pull_request:
    branches: [ "main", "develop", 'feature/**' ]
    paths:
      - 'backend/bookings-service/**'

jobs:
  build-and-test:
    name: Build, Teste e SonarCloud
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend/bookings-service

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./backend/bookings-service/package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Executar Testes Unitários e gerar Cobertura
        run: npm test -- --coverage

      - name: Análise no SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          SONAR_TOKEN: ${{ secrets.S0NAR_TOKEN }} 
        with:
          projectBaseDir: backend/bookings-service
          args: >
            -Dsonar.projectKey=nanapssz_trabalho-microsservico
            -Dsonar.organization=nanapssz
            -Dsonar.sources=src
            -Dsonar.tests=testes
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.D0CKER_USER }}
          password: ${{ secrets.D0CKER_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/bookings-service
          file: ./backend/bookings-service/Dockerfile
          push: true
          tags: ${{ secrets.D0CKER_USER }}/bookings-service:latest

  deploy-dev:
    name: Deploy para DEV (Render)
    runs-on: ubuntu-latest
    needs: build-and-push-docker 
    if: github.ref == 'refs/heads/develop' 

    steps:
      - name: Disparar Webhook do Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_BOOKINGS }}          

  semantic-release:
    name: Semantic Versioning Automático
    runs-on: ubuntu-latest
    needs: build-and-test 
    if: github.ref == 'refs/heads/develop' 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Bump Version e Criar Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} 
          default_bump: patch      